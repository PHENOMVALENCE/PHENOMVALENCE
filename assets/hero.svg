<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Valence Mwigani — software engineer and applied AI developer</title>
  <desc id="desc">Animated dark technical grid with blue and violet light, an engineering status panel, and Valence Mwigani's name.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.55" stop-color="#0a0d14"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#1683ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1683ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#35d0ba"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#88a2bf" stroke-opacity="0.08"/>
    </pattern>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="frameClip">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
    <style>
      .label { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2.6px; }
      .name { font: 700 64px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -2.8px; }
      .role { font: 500 20px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .2px; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .orbit { animation: orbit 12s linear infinite; transform-origin: 1080px 84px; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 7s ease-in-out infinite; }
      .dash { animation: dash 11s linear infinite; }
      .float-a { animation: floatA 9s ease-in-out infinite; }
      .float-b { animation: floatB 12s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity:.48; transform:scale(.9); } 50% { opacity:1; transform:scale(1.18); } }
      @keyframes scan { 0%,100% { transform:translateX(-360px); opacity:0; } 20%,70% { opacity:.65; } 85% { transform:translateX(1280px); opacity:0; } }
      @keyframes dash { to { stroke-dashoffset:-220; } }
      @keyframes floatA { 0%,100% { transform:translate(0,0); } 50% { transform:translate(34px,18px); } }
      @keyframes floatB { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-25px,-16px); } }
      @keyframes blink { 50% { opacity:0; } }
      @media (prefers-reduced-motion: reduce) { .orbit,.pulse,.scan,.dash,.float-a,.float-b,.blink { animation:none; } }
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1280" height="420" fill="url(#canvas)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>

    <circle class="float-a" cx="1030" cy="92" r="245" fill="url(#blueGlow)" filter="url(#softBlur)"/>
    <circle class="float-b" cx="265" cy="395" r="210" fill="url(#violetGlow)" filter="url(#softBlur)"/>

    <path class="dash" d="M-60 338C180 282 265 369 465 305S822 219 1015 274s260 1 340-46" fill="none" stroke="url(#signal)" stroke-opacity="0.42" stroke-width="1.5" stroke-dasharray="8 14"/>
    <rect class="scan" x="0" y="0" width="220" height="420" fill="url(#blueGlow)" opacity="0"/>

    <g opacity="0.78">
      <circle cx="1080" cy="84" r="48" fill="none" stroke="#58a6ff" stroke-opacity="0.2"/>
      <circle cx="1080" cy="84" r="70" fill="none" stroke="#8b5cf6" stroke-opacity="0.13" stroke-dasharray="3 9"/>
      <g class="orbit">
        <circle cx="1080" cy="14" r="4" fill="#58a6ff"/>
        <circle cx="1150" cy="84" r="3" fill="#35d0ba"/>
      </g>
      <circle class="pulse" cx="1080" cy="84" r="8" fill="#58a6ff"/>
    </g>

    <g transform="translate(72 62)">
      <rect x="0" y="0" width="154" height="30" rx="15" fill="#0d1521" stroke="#58a6ff" stroke-opacity="0.36"/>
      <circle class="pulse" cx="18" cy="15" r="4" fill="#35d0ba"/>
      <text class="label" x="32" y="20" fill="#a8b3c4">AVAILABLE</text>

      <text class="name" x="0" y="121" fill="#f7f9fc">VALENCE</text>
      <text class="name" x="0" y="185" fill="#f7f9fc">MWIGANI</text>
      <rect x="2" y="208" width="502" height="3" rx="1.5" fill="url(#signal)"/>
      <text class="role" x="0" y="252" fill="#a8b3c4">Software engineering · APIs · Applied AI</text>
    </g>

    <g transform="translate(825 204)">
      <rect width="383" height="148" rx="18" fill="#0b1018" fill-opacity="0.88" stroke="#91a4be" stroke-opacity="0.18"/>
      <circle cx="24" cy="22" r="4" fill="#ff6b6b"/>
      <circle cx="39" cy="22" r="4" fill="#f9c74f"/>
      <circle cx="54" cy="22" r="4" fill="#35d0ba"/>
      <text class="mono" x="22" y="61" fill="#64748b">$</text>
      <text class="mono" x="42" y="61" fill="#58a6ff">current_focus</text>
      <text class="mono" x="22" y="88" fill="#a8b3c4">→ product systems</text>
      <text class="mono" x="22" y="112" fill="#a8b3c4">→ intelligent software</text>
      <rect class="blink" x="22" y="126" width="8" height="2" fill="#35d0ba"/>
    </g>

    <text class="label" x="72" y="389" fill="#526278">DAR ES SALAAM / TANZANIA</text>
    <text class="label" x="1028" y="389" fill="#526278">BUILD 2026.08</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="27.5" fill="none" stroke="#91a4be" stroke-opacity="0.16"/>
</svg>
